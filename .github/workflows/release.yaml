name: Release

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Application image tag
        type: string
        required: true
      chartVersion:
        description: Semver v2 chart version
        type: string
        required: true

permissions:
  contents: write # Required to create release
  packages: write # Required to write OCI artifacts

jobs:
  check-release:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ inputs.chartVersion }} > /dev/null 2>&1; then
            echo "::error::Release v${{ inputs.chartVersion }} already exists"
            exit 1
          fi

  build-and-publish-image:
    runs-on: ubuntu-latest
    needs: check-release
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check-image
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository }}:${{ inputs.imageTag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.imageTag }}

      - name: Build and push image
        # Images should be treated as immutable, so only publish it doesn't already exist.
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  publish-chart:
    runs-on: ubuntu-latest
    needs:
      - check-release
      - build-and-publish-image
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Log in to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package ./chart --version ${{ inputs.chartVersion }} --app-version ${{ inputs.imageTag }}

      - name: Push Helm chart
        run: |
          helm push pod-image-policy-${{ inputs.chartVersion }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  create-release:
    runs-on: ubuntu-slim
    needs:
      - check-release
      - build-and-publish-image
      - publish-chart
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ inputs.chartVersion }} \
            --generate-notes \
            --notes "## New artifacts

          - **Application image**: \`ghcr.io/${{ github.repository }}:${{ inputs.imageTag }}\`
          - **Helm chart**: \`oci://ghcr.io/${{ github.repository_owner }}/charts/pod-image-policy:${{ inputs.chartVersion }}\`"

name: Release

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: Application image tag
        type: string
        required: true
      chartVersion:
        description: Semver v2 chart version
        type: string
        required: true

permissions:
  contents: write # Required to create release
  packages: write # Required to write OCI artifacts

jobs:
  check-release:
    runs-on: ubuntu-slim
    outputs:
      image-exists: ${{ steps.check-image.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ inputs.chartVersion }} > /dev/null 2>&1; then
            echo "::error::Release v${{ inputs.chartVersion }} already exists"
            exit 1
          fi

      - name: Check if image already exists
        id: check-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

          # Check if the package version with this tag exists
          if gh api "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" \
            --jq ".[] | select(.metadata.container.tags[] == \"${{ inputs.imageTag }}\") | .id" 2>/dev/null | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-and-publish-image:
    runs-on: ubuntu-latest
    needs: check-release
    # Only build image if new version. This lets us release chart updates
    # without updating app image
    if: needs.check-release.outputs.image-exists == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Cache Docker cache mount
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: cache
        with:
          path: cache-mount
          key: cache-mount-${{ hashFiles('Dockerfile', 'go.mod', 'go.sum') }}
          restore-keys: |
            cache-mount-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Setup Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.imageTag }}

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    runs-on: ubuntu-latest
    needs:
      - check-release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package ./chart --version ${{ inputs.chartVersion }} --app-version ${{ inputs.imageTag }}

      - name: Push Helm chart
        run: |
          helm push pod-image-policy-${{ inputs.chartVersion }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  create-release:
    runs-on: ubuntu-slim
    needs:
      - check-release
      - publish-chart
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ inputs.chartVersion }} \
            --generate-notes \
            --notes "## New artifacts

          - **Application image**: \`ghcr.io/${{ github.repository }}:${{ inputs.imageTag }}\`
          - **Helm chart**: \`oci://ghcr.io/${{ github.repository_owner }}/charts/pod-image-policy:${{ inputs.chartVersion }}\`"

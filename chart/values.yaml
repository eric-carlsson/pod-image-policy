# Default values for pod-image-policy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/eric-carlsson/pod-image-policy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Container arguments
args: []

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
# Default label opts the webhook pod out of mutation via the webhook's objectSelector.
podLabels:
  pod-image-policy.io/ignore-mutation: "true"
  pod-image-policy.io/ignore-validation: "true"

# This is for setting a priorityClassName on the Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
priorityClassName: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 9443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: https
    scheme: HTTPS
readinessProbe:
  httpGet:
    path: /ready
    port: https
    scheme: HTTPS

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# This section is for setting up a PodDisruptionBudget more information can be found here: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
podDisruptionBudget:
  enabled: false
  # Minimum number of pods that must be available during disruptions
  minAvailable: 1
  # Maximum number of pods that can be unavailable during disruptions
  # Only one of minAvailable or maxUnavailable can be set
  maxUnavailable: ""

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Configure cert-manager to manage webhook TLS certificates.
# Requires cert-manager to be installed in the cluster.
# When disabled, you must provide certificates manually via volumes/volumeMounts.
certManager:
  enabled: true
  # Create a namespaced self-signed Issuer for the webhook certificate.
  # Set to false if using an existing issuer (configured via issuerRef below).
  createSelfSignedIssuer: true
  # Reference to an existing cert-manager Issuer or ClusterIssuer.
  # Only used when createSelfSignedIssuer is false.
  issuerRef:
    # Name of the existing issuer
    name: ""
    # Kind of the existing issuer: Issuer or ClusterIssuer
    kind: Issuer
  # Private key algorithm for the certificate: RSA, ECDSA, Ed25519
  algorithm: RSA
  # Key size in bits.
  # RSA: 2048, 4096, or 8192
  # ECDSA: 256, 384, or 521
  # Ed25519: N/A
  size: 2048
  # Certificate lifetime (e.g., 8760h = 1 year)
  duration: 8760h
  # Time before expiration to renew certificate
  renewBefore: 720h

# Configuration for mutating/validatingwebhookconfigurations
webhooks:
  mutating:
    enabled: true
    path: /mutate
    # Service port used by the webhook; defaults to service.port
    port: ""
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    admissionReviewVersions:
      - v1
    # Base64-encoded CA bundle. Leave empty if injected by cert-manager cainjector.
    caBundle: ""
    # Rules the webhook applies to.
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - pods
    # Default objectSelector excludes pods carrying the ignore label (set above in podLabels)
    objectSelector:
      matchExpressions:
        - key: pod-image-policy.io/ignore-mutation
          operator: DoesNotExist

    # Optional namespaceSelector to include/exclude namespaces
    namespaceSelector: {}

  validating:
    enabled: true
    path: /validate
    # Service port used by the webhook; defaults to service.port
    port: ""
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    admissionReviewVersions:
      - v1
    # Base64-encoded CA bundle. Leave empty if injected by cert-manager cainjector.
    caBundle: ""
    # Rules the webhook applies to.
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - pods
    # Default objectSelector excludes pods carrying the ignore label (set above in podLabels)
    objectSelector:
      matchExpressions:
        - key: pod-image-policy.io/ignore-validation
          operator: DoesNotExist

    # Optional namespaceSelector to include/exclude namespaces
    namespaceSelector: {}

# Admission policy for the webhooks.
policy:
  mutate:
    rules: []
  validate:
    rules: []

